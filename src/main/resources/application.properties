spring.application.name=car

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/car_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
# SQL初始化（已手动执行，暂时禁用）
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.continue-on-error=true

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CAR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=1800

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
file.upload.path=/Users/lizijun/code/car/uploads/
file.upload.base-url=http://localhost:8081

# WeChat Configuration
wechat.appid=your_app_id
wechat.secret=your_app_secret

# Aliyun SMS Configuration
# 注意：以下配置来自示例代码，需要替换为你自己阿里云账号下的配置
# 开发环境建议使用 MockSmsServiceImpl（在 AliyunSmsServiceImpl 中注释 @Primary）
aliyun.sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:}
aliyun.sms.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
aliyun.sms.sign-name=杭州智象
aliyun.sms.template-code=SMS_289650573

# Logging Configuration
logging.level.root=INFO
logging.level.org.demo.car=DEBUG
logging.level.org.springframework.security=DEBUG
